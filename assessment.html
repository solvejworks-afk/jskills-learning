<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSkills Assessment</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="student.html"><span class="logo">JS</span><span><b>JSkills Assessment</b><small>20-question mastery</small></span></a><nav><a href="teacher.html">Teacher</a></nav></header><main class="wrap"><section class="hero"><span>TOPIC ASSESSMENT</span><h1>20 questions → mastery → intervention.</h1><p>Demo question engine linked to the student's selected grade and topic.</p></section><section class="card"><div class="form"><label>Grade<select id="grade"></select></label><label>Subject<select id="subject"></select></label><label class="full">Topic<select id="topic"></select></label></div><button class="btn" onclick="start()">Start Assessment →</button></section><section id="test" class="card hidden"><div class="chips"><span id="count"></span><span id="tn"></span></div><h2 id="q"></h2><div id="opts"></div><button class="btn" onclick="next()">Submit & Continue →</button></section><section id="res" class="card hidden"></section></main><script src="data.js"></script><script>
grade.innerHTML=Array.from({length:10},(_,i)=>`<option>${i+3}</option>`).join("");function subjects(){subject.innerHTML=[...new Set((JS_DATA[grade.value]||[]).map(x=>x[0]))].map(x=>`<option>${x}</option>`).join("");topics()}function topics(){topic.innerHTML=(JS_DATA[grade.value]||[]).filter(x=>x[0]===subject.value).map(x=>`<option>${x[1]}</option>`).join("")}grade.onchange=subjects;subject.onchange=topics;grade.value="3";subjects();let qi=0,score=0,qs=[];const bank=[["What is the best way to learn from an interactive model?",["Change a variable and observe the effect","Guess without testing","Skip the model","Copy an answer"],0],["Why record observations?",["To identify evidence and patterns","To decorate notes","To avoid reasoning","To replace assessment"],0],["What should you do after answering?",["Check your answer against the concept and evidence","Ignore the question","Change randomly","Skip review"],0]];function start(){qs=Array.from({length:20},(_,i)=>bank[i%3]);qi=0;score=0;test.classList.remove("hidden");res.classList.add("hidden");render()}function render(){let x=qs[qi];count.textContent=`Question ${qi+1}/20`;tn.textContent=`Grade ${grade.value} • ${subject.value} • ${topic.value}`;q.textContent=x[0];opts.innerHTML=x[1].map((o,i)=>`<label class="card" style="display:block;padding:10px;margin:7px 0;font-size:9px"><input type="radio" name="a" value="${i}"> ${String.fromCharCode(65+i)}. ${o}</label>`).join("")}function next(){let a=document.querySelector('input[name=a]:checked');if(!a)return alert("Choose an answer.");if(+a.value===qs[qi][2])score++;if(qi<19){qi++;render()}else finish()}function finish(){let pct=score*5,level=pct<50?"Remedial":pct<65?"Developing":pct<80?"On Track":"Advanced";localStorage.setItem("lastResult",JSON.stringify({grade:grade.value,subject:subject.value,topic:topic.value,pct,level}));test.classList.add("hidden");res.classList.remove("hidden");res.className="card "+(level==="Remedial"?"danger":level==="Advanced"?"success":"");res.innerHTML=`<h2>${pct}% — ${level}</h2><p>${score}/20 correct.</p><p><b>Teacher recommendation:</b> ${level==="Remedial"?"Re-teach with simulation and re-test.":level==="Developing"?"Guided practice and targeted re-test.":level==="On Track"?"Continue curriculum application.":"HOTS / Olympiad or NEET Foundation extension where appropriate."}</p><a class="btn" href="teacher.html">View Teacher Intelligence →</a>`}
</script></body></html>
