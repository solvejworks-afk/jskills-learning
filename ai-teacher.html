<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Teacher Assistant</title><link rel="stylesheet" href="style.css"></head><body><header><a href="teacher.html">← Teacher</a><b>AI Teacher Assistant</b></header><main class="wrap"><section class="hero"><span>AI-POWERED TEACHER WORKSPACE</span><h1>Teaching co-pilot</h1><p>Lesson plans, simulation recommendations, assessments and intervention. This GitHub demo uses local workflows; production AI must use a secure backend.</p></section><section class="card"><div class="form"><label>Grade<select id="g"></select></label><label>Subject<select><option>Science</option><option>Mathematics</option><option>English</option></select></label><label class="full">Topic<input id="t" value="Heat and Temperature"></label></div><button class="btn" onclick="go()">Generate Lesson Plan</button><div id="o" class="result hidden"></div></section></main><script>g.innerHTML=Array.from({length:10},(_,i)=>`<option>Grade ${i+3}</option>`).join("");function go(){o.classList.remove("hidden");o.textContent=`AI LESSON PLAN\\n\\n${g.value} • ${t.value}\\n\\nEngage → Explore simulation → Explain → Guided practice → 20Q assessment → Mastery analysis → Differentiated intervention.\\n\\nProduction: connect this interface through a secure backend to the chosen AI provider.`}</script></body></html>
