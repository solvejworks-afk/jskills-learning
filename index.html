<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSkills</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap" style="max-width:1000px"><section class="hero"><span>JSKILLS • SCHOOL LEARNING PLATFORM</span><h1>Learn. Simulate. Master.</h1><p>Grade 3–12 curriculum learning with real interactive simulations, assessments, teacher AI, mastery and intervention.</p></section><section class="card"><h2>School Login</h2><div class="form"><label>School<input id="school" value="ABC School"></label><label>Role<select id="role"><option>Student</option><option>Teacher</option><option>School Admin</option><option>Parent</option></select></label><label>User Name / ID<input id="user" placeholder="Demo User"></label><label>Board<select id="board"><option>CBSE</option><option>Matriculation</option></select></label><label id="gl">Grade<select id="grade"></select></label></div><button class="btn" onclick="login()">Continue →</button></section><section class="card"><h2>Platform</h2><div class="chips"><span>Grade 3–12</span><span>Real Simulations</span><span>20Q Assessment</span><span>OMR</span><span>AI Teacher</span><span>Olympiad</span><span>NEET Foundation</span><span>Reports</span><span>Gamification</span></div></section></main><script>grade.innerHTML=Array.from({length:10},(_,i)=>`<option>Grade ${i+3}</option>`).join("");function login(){sessionStorage.setItem("user",user.value||"Demo User");sessionStorage.setItem("school",school.value);sessionStorage.setItem("role",role.value);if(role.value==="Student")location.href="student.html";else if(role.value==="Teacher")location.href="teacher.html";else if(role.value==="Parent")location.href="parent.html";else location.href="school.html"}</script></body></html>
